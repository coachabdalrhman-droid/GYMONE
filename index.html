<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="نظام الجلاء برو لإدارة الصالات الرياضية والمشتركين والاشتراكات" />
    <title>الجلاء برو | Al Jalaa Pro</title>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-container">
        <div class="premium-ring"></div>
        <div class="loader-text">AL JALAA <span>PRO</span></div>
        <div class="loader-track"><div class="loader-progress"></div></div>
      </div>
      <p class="loader-caption">نظام إدارة الصالات الرياضية</p>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        window.setTimeout(() => {
          const loader = document.getElementById('loading-screen');
          if (!loader) return;
          loader.style.opacity = '0';
          window.setTimeout(() => loader.remove(), 500);
        }, 350);
      });
    </script>
  </body>
</html>
